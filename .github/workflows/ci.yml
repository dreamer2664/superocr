name: ci

# The OCR project's own checks. The tests in this repo are written as runnable
# scripts (each one prints PASS/FAIL and exits non-zero on failure) - that is
# the house style of the team that writes them, so CI runs them directly.
# pytest is used only when a file actually defines test_ functions.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install dependencies (only if declared)
        run: |
          python3 -m pip install --quiet --upgrade pip
          if [ -f requirements.txt ]; then python3 -m pip install --quiet -r requirements.txt; fi
          python3 -m pip install --quiet pillow numpy
      - name: run every test file in tests/ (script style, then pytest if applicable)
        run: |
          set -e
          shopt -s nullglob
          files=(tests/*.py)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no tests yet - the first task (S0, bench.py) brings them"
            exit 0
          fi
          fail=0
          for f in "${files[@]}"; do
            echo "::group::$f"
            if python3 "$f"; then echo "PASS $f"; else echo "FAIL $f"; fail=1; fi
            echo "::endgroup::"
          done
          exit $fail
      - name: bench smoke (only once bench.py exists)
        run: |
          if [ -f bench.py ]; then python3 bench.py --help >/dev/null && echo "bench.py responds"; else echo "bench.py not written yet"; fi
